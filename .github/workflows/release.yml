name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            artifact: botsharp-linux-x64.tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            artifact: botsharp-linux-arm64.tar.gz
          - rid: osx-x64
            os: macos-latest
            artifact: botsharp-osx-x64.tar.gz
          - rid: osx-arm64
            os: macos-latest
            artifact: botsharp-osx-arm64.tar.gz
          - rid: win-x64
            os: ubuntu-latest
            artifact: botsharp-win-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        working-directory: src
        run: >
          dotnet publish BotSharp/BotSharp.fsproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -o ../publish

      - name: Package (tar.gz)
        if: ${{ !contains(matrix.rid, 'win') }}
        run: |
          cd publish
          chmod +x botsharp
          tar czf ../${{ matrix.artifact }} botsharp

      - name: Package (zip)
        if: ${{ contains(matrix.rid, 'win') }}
        run: |
          cd publish
          zip ../${{ matrix.artifact }} botsharp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-arm64/*.tar.gz
            artifacts/osx-x64/*.tar.gz
            artifacts/osx-arm64/*.tar.gz
            artifacts/win-x64/*.zip

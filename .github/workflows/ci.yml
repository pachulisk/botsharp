name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore BotSharp.sln

      - name: Build
        working-directory: src
        run: dotnet build BotSharp.sln -c Release --no-restore

      - name: Test
        working-directory: src
        run: dotnet test BotSharp.Tests/BotSharp.Tests.fsproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/BotSharp.Tests/TestResults/*.trx
